services:
  dmd-search:
    build:
      context: .
      dockerfile: services/uk-dmd/Dockerfile
    restart: unless-stopped
    environment:
      DMD_DATA_DIR: /data
      DMD_HOST: 0.0.0.0
      DMD_PORT: "8081"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - dmd-data:/data:ro

  dmd-import:
    profiles: [import]
    build:
      context: .
      dockerfile: services/uk-dmd/importer/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx6g"
    secrets:
      - trud_api_key
    volumes:
      - dmd-data:/data
      - trud-cache:/cache

secrets:
  trud_api_key:
    environment: TRUD_API_KEY

volumes:
  dmd-data:
  trud-cache:
